<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Café Example – Reservierungs-Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f3ee;
      color: #2b211a;
      margin: 0;
      padding: 1.5rem;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    .login, .app {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      margin-top: 1rem;
    }
    input[type="password"], input[type="text"] {
      padding: 0.5rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(0,0,0,0.15);
      width: 100%;
      max-width: 260px;
      font: inherit;
    }
    button {
      padding: 0.45rem 0.9rem;
      border-radius: 0.6rem;
      border: none;
      cursor: pointer;
      font: inherit;
      margin-left: 0.5rem;
    }
    button.primary {
      background: #3f291c;
      color: #fff;
    }
    button.secondary {
      background: #e2ded6;
      color: #2b211a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 0.4rem 0.3rem;
      text-align: left;
    }
    th {
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    .neu { background: #fff3cd; color: #856404; }
    .bestaetigt { background: #d4edda; color: #155724; }
    .abgelehnt { background: #f8d7da; color: #721c24; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }
    .toolbar input[type="text"] {
      max-width: 220px;
    }
    .small {
      font-size: 0.8rem;
      color: #7a6c5d;
    }
  </style>
</head>
<body>
  <div class="login" id="loginView">
    <h1>Reservierungs-Admin</h1>
    <p class="small">Gib dein Admin-Passwort ein, um alle Reservierungen zu verwalten.</p>
    <div class="card">
      <label for="adminPass">Admin-Passwort</label><br>
      <input type="password" id="adminPass" />
      <button class="primary" id="loginBtn">Login</button>
      <p id="loginError" class="small" style="color:#b00020;margin-top:0.4rem;"></p>
    </div>
  </div>

  <div class="app" id="appView" style="display:none;">
    <h1>Café Example – Reservierungen</h1>
    <div class="card">
      <div class="toolbar">
        <div>
          <strong>Reservierungen</strong><br>
          <span class="small" id="resCount"></span>
        </div>
        <div>
          <input type="text" id="search" placeholder="Suche nach Name / Datum..." />
          <button class="secondary" id="refreshBtn">Neu laden</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Gast</th>
            <th>Datum</th>
            <th>Uhrzeit</th>
            <th>Pers.</th>
            <th>Status</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Einträge werden per JS eingefügt -->
        </tbody>
      </table>
      <p class="small" id="statusMsg"></p>
    </div>
  </div>

<script>
const API_BASE = ""; // gleiches Projekt, daher leer
let adminKey = null;
let allReservations = [];

function statusBadge(status) {
  const s = (status || "neu").toLowerCase();
  const cls = s === "bestaetigt" ? "bestaetigt" : s === "abgelehnt" ? "abgelehnt" : "neu";
  return '<span class="status-badge ' + cls + '">' + s + "</span>";
}

function renderTable(filter = "") {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  const term = filter.trim().toLowerCase();
  let list = allReservations;

  if (term) {
    list = list.filter(r =>
      (r.name || "").toLowerCase().includes(term) ||
      (r.datum || "").toLowerCase().includes(term) ||
      (r.status || "").toLowerCase().includes(term)
    );
  }

  document.getElementById("resCount").textContent =
    list.length + " Einträge (gesamt: " + allReservations.length + ")";

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="small">Keine Reservierungen gefunden.</td></tr>';
    return;
  }

  for (const r of list) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.id || ""}</td>
      <td>${r.name || ""}<br><span class="small">${r.email || ""}</span></td>
      <td>${r.datum || ""}</td>
      <td>${r.uhrzeit || ""}</td>
      <td>${r.personen || ""}</td>
      <td>${statusBadge(r.status)}</td>
      <td>
        <button class="primary" data-id="${r.id}" data-status="bestaetigt">Bestätigen</button>
        <button class="secondary" data-id="${r.id}" data-status="abgelehnt">Ablehnen</button>
      </td>
    `;
    tbody.appendChild(tr);
  }
}

async function loadReservations() {
  if (!adminKey) return;
  document.getElementById("statusMsg").textContent = "Lade Reservierungen...";
  try {
    const res = await fetch(API_BASE + "/api/admin-list", {
      headers: { "x-admin-key": adminKey }
    });
    if (!res.ok) {
      throw new Error("Fehler: " + res.status);
    }
    const data = await res.json();
    allReservations = data.reservations || [];
    renderTable(document.getElementById("search").value);
    document.getElementById("statusMsg").textContent = "";
  } catch (err) {
    console.error(err);
    document.getElementById("statusMsg").textContent =
      "Fehler beim Laden der Reservierungen.";
  }
}

async function updateStatus(id, status) {
  if (!adminKey) return;
  document.getElementById("statusMsg").textContent = "Aktualisiere Reservierung...";
  try {
    const res = await fetch(API_BASE + "/api/admin-update", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({ id, status })
    });
    if (!res.ok) {
      throw new Error("Fehler: " + res.status);
    }
    const data = await res.json();
    document.getElementById("statusMsg").textContent = data.message || "Aktualisiert.";
    await loadReservations();
  } catch (err) {
    console.error(err);
    document.getElementById("statusMsg").textContent =
      "Fehler beim Aktualisieren / Mailversand.";
  }
}

// Login-Handling
document.getElementById("loginBtn").addEventListener("click", () => {
  const pw = document.getElementById("adminPass").value.trim();
  if (!pw) return;
  adminKey = pw;
  // kleiner Test-Call
  fetch("/api/admin-list", {
    headers: { "x-admin-key": adminKey }
  })
    .then((res) => {
      if (!res.ok) throw new Error("Unauthorized");
      document.getElementById("loginView").style.display = "none";
      document.getElementById("appView").style.display = "block";
      document.getElementById("loginError").textContent = "";
      loadReservations();
    })
    .catch(() => {
      adminKey = null;
      document.getElementById("loginError").textContent =
        "Falsches Passwort oder Serverfehler.";
    });
});

// Suche
document.getElementById("search").addEventListener("input", (e) => {
  renderTable(e.target.value);
});

// Refresh
document.getElementById("refreshBtn").addEventListener("click", () => {
  loadReservations();
});

// Delegation für Buttons Bestätigen/Ablehnen
document.getElementById("tableBody").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  const status = btn.getAttribute("data-status");
  if (id && status) {
    updateStatus(id, status);
  }
});
</script>
</body>
</html>
